name: claims_analytics
version: "1.0.0"
config-version: 2

profile: claims_analytics
model-paths: ["models"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]

models:
  claims_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    dimensions:
      +materialized: table
      +schema: analytics
    facts:
      +schema: analytics
    marts:
      +materialized: table
      +schema: marts

snapshots:
  claims_analytics:
    +target_schema: snapshots
