[project]
name = "claims-portfolio"
version = "0.1.0"
description = "Deterministic synthetic P&C claims lifecycle data portfolio"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "snowflake-connector-python>=3.16,<4",
]

[project.scripts]
generate-claims-data = "claims_portfolio.generator:main"
load-claims-snowflake = "claims_portfolio.load_snowflake:main"

[dependency-groups]
dev = [
    "dbt-core>=1.10,<2",
    "dbt-snowflake>=1.10,<2",
    "pytest>=8.3,<9",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claims_portfolio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
